name: Public Subdomain Automator
on:
  issues:
    types: [opened]

jobs:
  build-dns:
    if: startsWith(github.event.issue.title, '[Subdomain Request]')
    runs-on: ubuntu-latest
    steps:
      - name: Parse Issue Body
        id: parse
        run: |
          BODY="${{ github.event.issue.body }}"
          PREFIX=$(echo "$BODY" | awk '/### Prefix/{getline; print}')
          TYPE=$(echo "$BODY" | awk '/### Type/{getline; print}')
          CONTENT=$(echo "$BODY" | awk '/### Destination/{getline; print}')
          
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "content=$CONTENT" >> $GITHUB_OUTPUT

      - name: Send API Request to DNSExit
        run: |
          curl -X POST https://dnsexit.com \
            -H "Content-Type: application/json" \
            -d '{
              "apikey": "${{ secrets.DNSEXIT_API_KEY }}",
              "domain": "work.gd",
              "add": [
                {
                  "type": "${{ steps.parse.outputs.type }}",
                  "name": "${{ steps.parse.outputs.prefix }}.honkpage3",
                  "content": "${{ steps.parse.outputs.content }}"
                }
              ]
            }'

      - name: Close Request Issue
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "Success! Your subdomain has been registered on DNSExit."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
