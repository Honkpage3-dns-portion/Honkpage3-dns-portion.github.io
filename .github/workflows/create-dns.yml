name: Create Subdomain
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: 'Subdomain Prefix (e.g., friend, dev)'
        required: true
      type:
        description: 'Record Type (A or CNAME)'
        required: true
        default: 'CNAME'
      content:
        description: 'Destination (IP address or Domain)'
        required: true

jobs:
  add-record:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Request to DNSExit
        run: |
          curl -X POST https://dnsexit.com \
            -H "Content-Type: application/json" \
            -d '{
              "apikey": "H68KmL2ndhaumvRa2GlMedW7jA1WOo",
              "domain": "work.gd",
              "add": [
                {
                  "type": "${{ github.event.inputs.type }}",
                  "name": "${{ github.event.inputs.prefix }}.honkpage3",
                  "content": "${{ github.event.inputs.content }}"
                }
              ]
            }'
